<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <h1>icone</h1>
        <nav>
            <form action="" id="formPesquisa">
                <input 
                id="inputPesquisa"
                class="inputDePesquisa"
                type="text"
                placeholder="Insira um id"
                >
                <button type="submit" id="btnPesquisa">Pesquisar</button>
            </form>
        </nav>
    </header>

    <div class="titulo">
        <h1 id="titulo">Busca de Pokémon</h1>
    </div>

    <main>

        <article class="caixaDaImagem">
            <img src="" alt="foto do pokemon" id="pokemonIMG">
        </article>

        <article class="displayDeInformações">
            <p>Nome: <span id="pokemonNome"></span></p>
            <p>Tipos:<span id="pokemonTipos"></span></p>
            <p>Habilidade: <span id="pokemonHabilidade"></span></p>
            <p>Peso: <span id="pokemonPeso"></span></p>
            <div>
                <button type="button" id="btnAnterior">Anterior</button>
                <button type="button" id="btnProximo">Proximo</button>
            </div>
        </article>

    </main>

</body>
</html>
